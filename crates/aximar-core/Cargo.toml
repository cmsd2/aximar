[package]
name = "aximar-core"
version = "0.15.2"
edition = "2021"
description = "Core library for Aximar — Tauri-independent Maxima CAS logic"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
regex = "1"
thiserror = "2"
tempfile = "3"
dirs = "6"
aximar-notebook-format = { path = "../../packages/aximar-notebook-format" }
probly-search = "2"
base64 = "0.22"
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
