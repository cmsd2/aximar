[package]
name = "aximar"
version = "0.15.2"
description = "A modern desktop GUI for the Maxima computer algebra system"
authors = ["you"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "aximar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
aximar-core = { path = "../crates/aximar-core" }
aximar-mcp = { path = "../crates/aximar-mcp" }
tauri = { version = "2.12.7", features = [] }
tauri-plugin-opener = "2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "1.8", features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
tokio-util = "0.7"
tracing = "0.1"
rand = "0.9"
regex = "1"
thiserror = "2"
tauri-plugin-dialog = "2.8.4"
toml_edit = "0.22"
tauri-plugin-single-instance = "2.5.5"
sys-locale = "0.3"
fluent-langneg = "0.14"
rspolib = "0.1.2"
which = "8"

[features]
# The translation preview in release builds, for translators' pre-release
# builds; debug builds always have it.  See docs/i18n.md.
translator-tools = []

[dev-dependencies]
tempfile = "3"
