[package]
name = "aximar-notebook-format"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Reads and writes Maxima notebook files (.macnb, nbformat 4.5) the way Aximar does"
repository = "git+https://github.com/cmsd2/aximar.git"
readme = "README.md"

[lib]
# rlib for aximar-core; cdylib for the WebAssembly npm package
crate-type = ["cdylib", "rlib"]

[features]
# The npm package: wasm-pack build --release --target nodejs -- --features wasm
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:tsify-next", "getrandom/js"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
getrandom = "0.2"
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
tsify-next = { version = "0.5", optional = true, default-features = false, features = ["js"] }
