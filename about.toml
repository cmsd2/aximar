# cargo-about: the Rust crates' licence notices, in
# public/licenses/third-party-rust.html.  `npm run licences:rust`
# regenerates them; see docs/licences.md.  The accepted list matches
# scripts/accepted-licences.ts, in the same order of preference.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "MIT-0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "OFL-1.1",
    "MPL-2.0",
]

# Every platform Aximar builds for, so platform-only crates are listed
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

# Only what the binaries link
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Aximar's own crates: they're the app itself, not third-party code, and
# scripts/rust-notices.mjs leaves them out of the notices
[aximar]
accepted = ["GPL-3.0-or-later"]
[aximar-core]
accepted = ["GPL-3.0-or-later"]
[aximar-mcp]
accepted = ["GPL-3.0-or-later"]
[maxima-dap]
accepted = ["GPL-3.0-or-later"]
[maxima-lsp]
accepted = ["GPL-3.0-or-later"]
[maxima-mac-parser]
accepted = ["GPL-3.0-or-later"]
