name: Build

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE*'
  # PRs build the full matrix only when labelled full-build (see the job's
  # `if`). Adding the label starts a build; later pushes rebuild while it
  # stays on. ci.yml runs the tests on every PR.
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE*'
  # Any branch, on demand: gh workflow run build.yml --ref <branch>
  workflow_dispatch:

jobs:
  build:
    # On PRs: only with the full-build label, and for a labeled event only
    # when that label is the one just added, so other labels don't rebuild.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'full-build') &&
       (github.event.action != 'labeled' || github.event.label.name == 'full-build'))

    # A new push to a PR supersedes its build in progress. Master builds
    # queue instead of cancelling the running one. Set on the job, not the
    # workflow, so a skipped run can't cancel a real one. The group includes
    # the target: a group holds one running and one waiting job, and GitHub
    # cancels any other waiting job, so a group shared by the whole matrix
    # let only two of the six targets build.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.rust-target }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-target: aarch64-apple-darwin
            artifact-name: aximar-macos-arm64
            artifact-path: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: macos-latest
            rust-target: x86_64-apple-darwin
            artifact-name: aximar-macos-x64
            artifact-path: |
              target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          # Linux builds run on Ubuntu 24.04, so the packages work there and on
          # newer systems: a binary needs at least the glibc it was built with.
          - os: ubuntu-24.04
            rust-target: x86_64-unknown-linux-gnu
            artifact-name: aximar-linux-x64
            artifact-path: |
              target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
              target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          # Built natively on GitHub's arm64 runner, so no cross toolchain.
          - os: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            artifact-name: aximar-linux-arm64
            bundles: deb
            artifact-path: |
              target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            artifact-name: aximar-windows-x64
            artifact-path: |
              target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - os: windows-11-arm
            rust-target: aarch64-pc-windows-msvc
            artifact-name: aximar-windows-arm64
            artifact-path: |
              target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi
              target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust-target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            rpm

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npx tauri build --target ${{ matrix.rust-target }} ${{ matrix.bundles && format('--bundles {0}', matrix.bundles) || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
