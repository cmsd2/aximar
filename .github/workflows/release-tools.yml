name: Release Tools

on:
  push:
    tags:
      - "tools-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # Linux builds run on Ubuntu 24.04, so the tools work there and on
          # newer systems: a binary needs at least the glibc it was built with.
          # arm64 builds natively on GitHub's arm64 runner.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Build tools
        run: cargo build --release --target ${{ matrix.target }} -p maxima-lsp -p maxima-dap -p aximar-mcp

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../aximar-tools-${{ matrix.target }}.tar.gz \
            maxima-lsp maxima-dap aximar-mcp

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binDir = "target/${{ matrix.target }}/release"
          Compress-Archive -Path "$binDir/maxima-lsp.exe","$binDir/maxima-dap.exe","$binDir/aximar-mcp.exe" `
            -DestinationPath "aximar-tools-${{ matrix.target }}.zip"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: aximar-tools-${{ matrix.target }}.*
          draft: true
          generate_release_notes: true
