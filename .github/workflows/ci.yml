name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE*'
  # Every base branch, so a PR stacked on another PR's branch gets checked too
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE*'

# A new push to a PR supersedes its run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Its own job: it needs no system packages, so it fails within a minute
  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # The translation catalogs in locales/.  In Alpine, for GNU gettext 0.24
  # or later, the first to read Rust: Ubuntu's is older.  The test job's
  # catalog test checks the translations themselves.
  i18n:
    runs-on: ubuntu-latest
    container: alpine:3.24

    steps:
      - name: Install gettext and Node
        run: apk add --no-cache gettext nodejs npm git

      - uses: actions/checkout@v4

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Test the backtick check
        run: node --test scripts/i18n-backticks.node-test.mjs

      - name: Check the template and catalogs are up to date
        run: scripts/i18n-extract --check

      - name: Check each catalog is valid
        run: |
          for po in locales/*.po; do
            msgfmt --check --output-file=/dev/null "$po"
          done

  # The Rust crates' licence notices, which the app and the tools ship,
  # must match Cargo.lock.  See docs/licences.md.
  licences:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the notices script
        run: node --test scripts/rust-notices.node-test.mjs

      - name: Check the Rust licence notices are current
        run: npm run licences:rust -- --check

  # The translators' gallery: Storybook, with a screenshot of every story
  # in every language.  Uploaded as an artifact; see docs/i18n.md.
  gallery:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build Storybook and take the screenshots
        run: npm run i18n:gallery

      # The stories each string appears in become `#. screen:` comments
      # in the catalog; say so when they've moved
      - name: Check the screens are current
        run: |
          if ! git diff --quiet -- locales/screens.json; then
            echo "::warning::locales/screens.json changed: run npm run i18n:gallery, then scripts/i18n-extract, and commit both"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: translator-gallery
          path: storybook-static

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      # src-tauri is a workspace member, so cargo test needs the Tauri
      # system libraries even though no bundle is built.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # New styles use the design tokens: no raw colour, font size or
      # radius beyond the baseline.  See docs/design-library.md.
      - name: Check the stylesheets use the design tokens
        run: |
          node --test scripts/check-css-tokens.node-test.mjs
          npm run check:tokens

      # Type-checks the frontend, and produces dist/, which src-tauri's
      # generate_context! needs at compile time.
      - name: Build frontend
        run: npm run build

      # The window's tests (vitest, in happy-dom): components, stores, and
      # the libraries under src/lib and scripts/
      - name: Run the frontend tests
        run: npm test

      # After the frontend build: src-tauri needs dist/ to compile
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Tests that need a real Maxima are #[ignore]d or gated on
      # AXIMAR_RUN_LIVE_TESTS, so this runs without Maxima installed.
      - name: Run tests
        run: cargo test --workspace

      # The notebook format's npm package: the same crate as WebAssembly,
      # checked against the shared test notebooks
      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown

      # The wasm feature's code, which the workspace clippy run doesn't build
      - name: Clippy for the wasm build
        run: cargo clippy -p aximar-notebook-format --features wasm --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build and test the notebook format's npm package
        working-directory: packages/aximar-notebook-format
        run: |
          wasm-pack build --release --target nodejs --out-dir pkg -- --features wasm
          node --test js/smoke.mjs
