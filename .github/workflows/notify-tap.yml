name: Notify tap

# Publishing a release (by hand, from the draft the Release workflow makes)
# tells cmsd2/homebrew-tap to run its Bump workflow straight away.
on:
  release:
    types: [published]
  # Run by hand to check TAP_DISPATCH_TOKEN; the tap's Bump finds nothing new.
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Send aximar-released to cmsd2/homebrew-tap
        env:
          # Fine-grained PAT: cmsd2/homebrew-tap only, Contents read/write.
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::TAP_DISPATCH_TOKEN is not set; the tap's daily run will pick this release up"
            exit 0
          fi
          gh api repos/cmsd2/homebrew-tap/dispatches -f event_type=aximar-released
